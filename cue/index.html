<title>Qシート</title>

<style>
:root{--bg:#0b0b0f;--card:#17171c;--card2:#202027;--line:#2c2c35;--tx:#f5f5f7;--sub:#9a9aa5;--blue:#0a84ff;--amber:#ff9f0a;--green:#30d158;--red:#ff453a;--safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,select,textarea{font:inherit;color:var(--tx);background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;width:100%;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--blue)}
.hidden{display:none!important}

/* 入室画面 */
#join{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:calc(24px + var(--safe-t)) 22px 32px;max-width:460px;margin:0 auto}
#join h1{font-size:34px;margin:0 0 4px;letter-spacing:.02em}
#join .lead{color:var(--sub);margin:0 0 26px;font-size:15px}
.field{margin-bottom:16px}
.field label{display:block;font-size:13px;color:var(--sub);margin:0 0 6px 4px}
.depts{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:9px 14px;border-radius:999px;background:var(--card2);border:1px solid var(--line);font-size:15px}
.chip.on{background:var(--blue);border-color:var(--blue);color:#fff}
.switch-row{display:flex;align-items:center;justify-content:space-between;background:var(--card);border-radius:14px;padding:14px 16px;margin-bottom:12px}
.switch{width:51px;height:31px;border-radius:999px;background:#39393f;position:relative;transition:.2s;flex:none}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;transition:.2s}
.switch.on{background:var(--green)}.switch.on::after{left:22px}
.primary{width:100%;padding:16px;border-radius:14px;background:var(--blue);color:#fff;font-weight:700;font-size:17px;margin-top:8px}
.err{color:var(--red);font-size:14px;min-height:20px;margin-top:10px;text-align:center}
.mode-note{font-size:12px;color:var(--sub);text-align:center;margin-top:18px;line-height:1.6}
.mode-note b{color:var(--amber)}

/* メイン */
#main{min-height:100vh;padding:calc(10px + var(--safe-t)) 14px calc(20px + var(--safe-b));max-width:720px;margin:0 auto}
body.director #main{padding-bottom:calc(190px + var(--safe-b))}
.top{display:flex;align-items:center;gap:10px;padding:4px 2px 12px}
.top .ev{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .me{font-size:12px;color:var(--sub)}
.top .sp{flex:1}
.clock{font-variant-numeric:tabular-nums;font-size:22px;font-weight:600}
.icon-btn{background:var(--card);border-radius:10px;padding:7px 10px;font-size:13px;color:var(--sub);white-space:nowrap}

.card{background:var(--card);border-radius:20px;padding:18px;margin-bottom:12px;position:relative;overflow:hidden}
.label{font-size:12px;letter-spacing:.12em;color:var(--sub);font-weight:700;display:flex;align-items:center;gap:8px}
.qno{font-variant-numeric:tabular-nums;color:var(--sub);font-weight:700}
#now{min-height:38vh;display:flex;flex-direction:column;justify-content:center;text-align:center;border:2px solid transparent;transition:border-color .3s}
#now .label{justify-content:center}
#nowTitle{font-weight:800;line-height:1.2;margin:14px 0 10px;white-space:nowrap}
#nowTitle.wrap{white-space:normal}
#nowNo{font-size:20px}
.tags{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.tag{font-size:12px;padding:3px 9px;border-radius:999px;background:var(--card2);color:var(--sub)}
.tag.mine{background:rgba(10,132,255,.2);color:#6cb6ff}
.memo{color:var(--sub);font-size:15px;margin-top:10px;white-space:pre-wrap}
.elapsed{font-variant-numeric:tabular-nums;font-size:15px;color:var(--sub);margin-top:12px}

#next{border:2px solid transparent;transition:.25s}
#next .row{display:flex;align-items:baseline;gap:10px;margin-top:8px}
#nextTitle{font-size:24px;font-weight:700;flex:1;min-width:0}
.ptime{font-variant-numeric:tabular-nums;color:var(--sub);font-size:15px;white-space:nowrap}
.yours{display:inline-block;background:var(--blue);color:#fff;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px}

body.standby #next{border-color:var(--amber);animation:pulse 1s infinite}
body.standby .sb-badge{display:inline-block}
.sb-badge{display:none;background:var(--amber);color:#000;font-weight:800;font-size:12px;padding:3px 9px;border-radius:999px;letter-spacing:.08em}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,159,10,.0)}50%{box-shadow:0 0 0 6px rgba(255,159,10,.35)}}

#flash{position:fixed;inset:0;background:var(--green);opacity:0;pointer-events:none;z-index:50;display:flex;align-items:center;justify-content:center;font-size:96px;font-weight:900;color:#000;letter-spacing:.05em}
#flash.show{animation:flash 1.1s ease-out}
@keyframes flash{0%{opacity:.95}70%{opacity:.6}100%{opacity:0}}

.list-head{display:flex;align-items:center;justify-content:space-between;margin:18px 4px 8px}
.list-head h2{font-size:15px;margin:0;color:var(--sub);font-weight:600}
.seg{display:flex;background:var(--card);border-radius:10px;padding:2px}
.seg button{padding:6px 10px;border-radius:8px;font-size:13px;color:var(--sub)}
.seg button.on{background:var(--card2);color:var(--tx)}
.qlist{background:var(--card);border-radius:16px;overflow:hidden}
.qitem{display:flex;gap:12px;align-items:center;padding:13px 16px;border-bottom:1px solid var(--line)}
.qitem:last-child{border-bottom:0}
.qitem .n{font-variant-numeric:tabular-nums;color:var(--sub);width:44px;flex:none;font-weight:700}
.qitem .t{flex:1;min-width:0}
.qitem .t div:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qitem .t .d{font-size:12px;color:var(--sub);margin-top:2px}
.qitem.done{opacity:.35}
.qitem.cur{background:rgba(48,209,88,.12)}
.qitem.mine .n{color:#6cb6ff}
body.director .qitem{cursor:pointer}

/* Q出し役コントロール */
#ctrl{position:fixed;left:0;right:0;bottom:0;background:rgba(11,11,15,.92);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid var(--line);padding:12px 14px calc(12px + var(--safe-b));z-index:20}
#ctrl .inner{max-width:720px;margin:0 auto;display:grid;grid-template-columns:1fr 1.3fr 2fr;gap:10px}
#ctrl .inner button{height:76px;border-radius:18px;font-weight:800;font-size:18px}
#bBack{background:var(--card2);color:var(--sub)}
#bSB{background:#3a2a0a;color:var(--amber);border:2px solid var(--amber)}
#bSB.on{background:var(--amber);color:#000}
#bGO{background:var(--green);color:#000;font-size:28px}
#bGO:active{transform:scale(.97)}
#ctrl .tools{max-width:720px;margin:0 auto 10px;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}#ctrl .tools .icon-btn{flex:none}

/* シート */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:#121216;width:100%;max-width:720px;max-height:92vh;border-radius:20px 20px 0 0;display:flex;flex-direction:column}
.sheet-h{display:flex;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line)}
.sheet-h h3{flex:1;margin:0;font-size:17px;text-align:center}
.sheet-h button{color:var(--blue);font-size:16px;min-width:64px}
.sheet-h button.save{font-weight:700;text-align:right}
.sheet-b{overflow:auto;padding:14px 16px calc(24px + var(--safe-b))}
.ecard{background:var(--card);border-radius:14px;padding:12px;margin-bottom:10px}
.ecard .r1{display:grid;grid-template-columns:70px 1fr 84px;gap:8px;margin-bottom:8px}
.ecard input{padding:10px 11px;font-size:15px}
.ecard .depts .chip{padding:6px 11px;font-size:13px}
.ecard .r3{display:flex;gap:8px;margin-top:8px}
.ecard .r3 input{flex:1}
.ecard .ops{display:flex;gap:4px}
.ecard .ops button{background:var(--card2);border-radius:10px;width:40px;font-size:15px}
.ecard .ops button.del{color:var(--red)}
.ghost{width:100%;padding:13px;border-radius:12px;border:1px dashed var(--line);color:var(--blue);margin-bottom:10px}
details{background:var(--card);border-radius:14px;padding:12px;margin-top:6px}
summary{color:var(--sub);font-size:14px}
.hint{font-size:12px;color:var(--sub);line-height:1.6}
.pp{display:flex;justify-content:space-between;padding:12px 4px;border-bottom:1px solid var(--line)}
.pp .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--green);margin-right:8px}
.pp.off{opacity:.45}.pp.off .dot{background:#636370}
.pp-sec{font-size:12px;color:var(--sub);letter-spacing:.1em;margin:14px 4px 2px;font-weight:700}
.conn{display:flex;align-items:center;justify-content:flex-end;gap:5px;font-size:11px;color:var(--sub);margin-top:2px}
.conn i{width:7px;height:7px;border-radius:50%;background:#636370;display:inline-block}
.conn.on i{background:var(--green)}.conn.off{color:var(--red)}.conn.off i{background:var(--red)}
#offBanner{position:sticky;top:0;z-index:30;background:var(--red);color:#fff;font-weight:700;font-size:14px;text-align:center;padding:10px 12px;border-radius:12px;margin-bottom:10px}
#ackBtn{width:100%;margin-top:14px;padding:16px;border-radius:14px;background:var(--amber);color:#000;font-weight:800;font-size:18px}
#ackBtn.done{background:var(--card2);color:var(--green)}
#ackBox{margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
#ackBox .ackh{font-size:13px;color:var(--sub);margin-bottom:8px}
#ackBox .ackh b{color:var(--tx);font-size:16px}
.ack{display:inline-flex;align-items:center;gap:5px;font-size:13px;padding:5px 10px;border-radius:999px;background:var(--card2);color:var(--sub);margin:0 6px 6px 0}
.ack.ok{background:rgba(48,209,88,.18);color:var(--green)}
.ack.gone{text-decoration:line-through;opacity:.5}
/* タイムライン */
#tl{margin-top:14px;text-align:left}
.tl-big{background:var(--card2);border-radius:16px;padding:14px 16px;text-align:center}
.tl-big .lb{font-size:13px;color:var(--sub)}
.tl-big .what{font-size:22px;font-weight:800;margin:4px 0 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tl-big .cd{font-size:64px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.05;letter-spacing:.01em}
.tl-big .abs{font-size:14px;color:var(--sub);font-variant-numeric:tabular-nums}
.tl-big.soon{background:rgba(255,159,10,.18)}.tl-big.soon .cd{color:var(--amber)}
.tl-big.mine .what::before{content:"あなたの担当　";font-size:12px;color:#6cb6ff;font-weight:700;vertical-align:middle}
.tl-bar{height:6px;border-radius:3px;background:var(--card2);margin:12px 2px 6px;position:relative;overflow:hidden}
.tl-bar i{position:absolute;left:0;top:0;bottom:0;background:var(--green);border-radius:3px}
.tl-remain{display:flex;justify-content:space-between;font-size:13px;color:var(--sub);font-variant-numeric:tabular-nums;padding:0 2px}
.tl-row{display:flex;align-items:center;gap:10px;padding:9px 4px;border-bottom:1px solid var(--line);font-size:14px}
.tl-row:last-child{border-bottom:0}
.tl-row .t{font-variant-numeric:tabular-nums;width:72px;flex:none;font-weight:700}
.tl-row .r{font-variant-numeric:tabular-nums;color:var(--sub);width:64px;flex:none;font-size:12px}
.tl-row .l{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tl-row.done{opacity:.35}.tl-row.done .t::after{content:" ✓"}
.tl-row.nx{color:var(--amber)}
.tl-row.mine .l{color:#6cb6ff}
#flash.ev{background:var(--amber)}
#flash{text-align:center;padding:20px;line-height:1.15}
/* 編集：タイムライン */
.ecard .r4{display:flex;gap:8px;align-items:center;margin-top:8px}
.ecard .r4 input{width:96px;flex:none}
.ecard .r4 .hint{flex:1}
.evrow{display:grid;grid-template-columns:96px 70px 1fr 34px;gap:6px;margin-top:6px;align-items:center}
.evrow select,.evrow input{padding:9px 8px;font-size:14px}
.evrow .sub2{grid-column:1 / -1;display:flex;gap:6px;align-items:center}
.evrow .sub2 select{flex:none;width:110px}
.evrow .sub2 .hint{flex:1}
.evrow button{background:var(--card2);border-radius:10px;height:38px;color:var(--red)}
.addev{font-size:13px;color:var(--blue);padding:8px 0}
</style>
</head>
<body>

<!-- 入室 -->
<section id="join">
  <h1>Qシート</h1>
  <p class="lead">チームで共有するオンタイムQ出し</p>

  <div class="field"><label>イベントの合言葉</label><input id="jCode" placeholder="例：escon1203" autocomplete="off" autocapitalize="off"></div>
  <div class="field"><label>お名前</label><input id="jName" placeholder="例：内藤" autocomplete="off"></div>
  <div class="field"><label>担当</label><div class="depts" id="jDepts"></div></div>

  <div class="switch-row"><span>Q出し役として入る</span><button class="switch" id="jDirSw" aria-label="Q出し役"></button></div>
  <div class="field hidden" id="jPinBox"><label>Q出し役の暗証番号（最初に入った人が決めます）</label><input id="jPin" inputmode="numeric" placeholder="4桁以上" autocomplete="off"></div>

  <button class="primary" id="jGo">入る</button>
  <div class="err" id="jErr"></div>
  <div class="mode-note" id="modeNote"></div>
</section>

<!-- メイン -->
<section id="main" class="hidden">
  <div class="top">
    <div style="min-width:0">
      <div class="ev" id="evName"></div>
      <div class="me" id="meLine"></div>
    </div>
    <div class="sp"></div>
    <div><div class="clock" id="clock">--:--:--</div><div class="conn" id="conn"><i></i><span>接続中…</span></div></div>
  </div>
  <div id="offBanner" class="hidden">オフライン — 表示が止まっている可能性があります。電波を確認してください</div>

  <div class="card" id="now">
    <div class="label">いまのQ</div>
    <div id="nowNo" class="qno"></div>
    <div id="nowTitle">開演前</div>
    <div class="tags" id="nowTags"></div>
    <div class="memo" id="nowMemo"></div>
    <div class="elapsed" id="nowElapsed"></div>
    <div id="tl"></div>
  </div>

  <div class="card" id="next">
    <div class="label">つぎのQ <span class="sb-badge">STANDBY</span> <span class="yours hidden" id="nextYours">あなたの担当</span></div>
    <div class="row"><span class="qno" id="nextNo"></span><div id="nextTitle">—</div><span class="ptime" id="nextTime"></span></div>
    <div class="tags" style="justify-content:flex-start;margin-top:8px" id="nextTags"></div>
    <div class="memo" id="nextMemo"></div>
    <button id="ackBtn" class="hidden">スタンバイOK</button>
    <div id="ackBox" class="hidden"></div>
  </div>

  <div class="list-head">
    <h2>キューリスト</h2>
    <div class="seg"><button id="fAll" class="on">すべて</button><button id="fMine">自分の担当</button></div>
  </div>
  <div class="qlist" id="qlist"></div>

  <div style="display:flex;gap:8px;justify-content:center;margin-top:20px;flex-wrap:wrap">
    <button class="icon-btn" id="bPeople">👥 参加者 <span id="pCount">0</span></button>
    <button class="icon-btn" id="bSound">🔔 音 OFF</button>
    <button class="icon-btn" id="bLogout">退出</button>
  </div>
</section>

<!-- Q出し役コントロール -->
<div id="ctrl" class="hidden">
  <div class="tools">
    <button class="icon-btn" id="bEdit">✏️ キューを編集</button>
    <button class="icon-btn" id="bReset">⟲ 最初に戻す</button>
    <button class="icon-btn hidden" id="bResync">⏱ 開始を今に合わせる</button>
    <button class="icon-btn" id="bPeople2" style="margin-left:auto">👥 <span id="pCount2">0</span></button>
  </div>
  <div class="inner">
    <button id="bBack">◀ 戻す</button>
    <button id="bSB">STANDBY</button>
    <button id="bGO">GO</button>
  </div>
</div>

<div id="flash">GO</div>

<!-- 編集シート -->
<div class="sheet-bg hidden" id="editSheet">
  <div class="sheet">
    <div class="sheet-h"><button id="eCancel">キャンセル</button><h3>キューを編集</h3><button class="save" id="eSave">保存</button></div>
    <div class="sheet-b">
      <div class="field"><label>イベント名</label><input id="eTitle" placeholder="例：ETHICS FUTURES 2026"></div>
      <div id="eList"></div>
      <button class="ghost" id="eAdd">＋ キューを追加</button>
      <details>
        <summary>Excel・スプレッドシートから貼り付け</summary>
        <p class="hint">列の順番：番号／内容／担当（「照明,音響」のようにカンマ区切り）／予定時刻／メモ／長さ（例 9:29）<br>貼り付けると今のリストが置き換わります。</p>
        <textarea id="ePaste" rows="6" placeholder="Q1	客入れBGM	音響	17:30	"></textarea>
        <button class="ghost" id="ePasteGo" style="margin-top:8px">この内容で置き換える</button>
      </details>
    </div>
  </div>
</div>

<!-- 参加者シート -->
<div class="sheet-bg hidden" id="peopleSheet">
  <div class="sheet">
    <div class="sheet-h"><span style="min-width:64px"></span><h3>参加者</h3><button id="pClose">閉じる</button></div>
    <div class="sheet-b" id="pList"></div>
  </div>
</div>

<script type="module">
const DEPTS = ['全体','照明','音響','映像','舞台','MC','ドローン','撮影'];
const SESSION_KEY = 'cueq-session';
const SESSION_HOURS = 24;
const FB_VER = '10.12.2';
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const toArr = v => Array.isArray(v) ? v.filter(Boolean) : (v ? Object.values(v).filter(Boolean) : []);
const isDemo = !window.FIREBASE_CONFIG;

/* ---------- 保存（localStorage は失敗しても動くように） ---------- */
const ls = {
  get(k){ try { return JSON.parse(localStorage.getItem(k)); } catch(e){ return null; } },
  set(k,v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} },
  del(k){ try { localStorage.removeItem(k); } catch(e){} }
};

/* ---------- データの置き場所：デモ（同じブラウザ内）／Firebase ---------- */
function demoStore(code){
  const key = 'cueq-demo-' + code;
  const bc = ('BroadcastChannel' in window) ? new BroadcastChannel(key) : null;
  const subs = [];
  const read = () => ls.get(key) || {};
  const emit = () => { const d = read(); subs.forEach(f => f(d)); };
  const write = d => { ls.set(key, d); emit(); bc && bc.postMessage(1); };
  if (bc) bc.onmessage = emit;
  addEventListener('storage', e => { if (e.key === key) emit(); });
  return {
    offset: () => 0,
    async getMeta(){ return read().meta || null; },
    async setMeta(m){ const d = read(); d.meta = m; write(d); },
    subscribe(f){ subs.push(f); f(read()); },
    async setState(s){ const d = read(); d.state = s; write(d); },
    async setCues(c){ const d = read(); d.cues = c; write(d); },
    async setTitle(t){ const d = read(); d.meta = {...(d.meta||{}), title:t}; write(d); },
    presence(id, info){
      const beat = () => {
        const d = read(); d.presence = d.presence || {};
        d.presence[id] = {...(d.presence[id]||{}), ...info, online: navigator.onLine, at: Date.now()};
        write(d);
      };
      beat(); setInterval(beat, 8000);
      addEventListener('pagehide', () => { const d = read(); if (d.presence && d.presence[id]){ d.presence[id].online = false; ls.set(key, d); bc && bc.postMessage(1); } });
    },
    async ack(id, v){ const d = read(); d.presence = d.presence || {}; d.presence[id] = {...(d.presence[id]||{}), ack: v}; write(d); },
    onConn(cb){ const f = () => cb(navigator.onLine); addEventListener('online', f); addEventListener('offline', f); f(); }
  };
}

async function firebaseStore(code){
  const base = `https://www.gstatic.com/firebasejs/${FB_VER}/`;
  const { initializeApp } = await import(base + 'firebase-app.js');
  const { getAuth, signInAnonymously } = await import(base + 'firebase-auth.js');
  const D = await import(base + 'firebase-database.js');
  const app = initializeApp(window.FIREBASE_CONFIG);
  const auth = getAuth(app);
  await signInAnonymously(auth);
  const db = D.getDatabase(app);
  const root = D.ref(db, 'rooms/' + code);
  let off = 0; const connCbs = [];
  D.onValue(D.ref(db, '.info/serverTimeOffset'), s => { off = s.val() || 0; });
  return {
    uid: auth.currentUser.uid,
    offset: () => off,
    async getMeta(){ return (await D.get(D.child(root, 'meta'))).val(); },
    async setMeta(m){ await D.set(D.child(root, 'meta'), m); },
    subscribe(f){ D.onValue(root, s => f(s.val() || {})); },
    setState(s){ return D.set(D.child(root, 'state'), s); },
    setCues(c){ return D.set(D.child(root, 'cues'), c); },
    setTitle(t){ return D.set(D.child(root, 'meta/title'), t); },
    presence(id, info){
      const p = D.child(root, 'presence/' + id);
      D.onValue(D.ref(db, '.info/connected'), s => {
        const on = !!s.val();
        connCbs.forEach(f => f(on));
        if (on) { D.onDisconnect(p).update({ online:false, at: D.serverTimestamp() }); D.update(p, {...info, online:true, at: D.serverTimestamp()}); }
      });
    },
    ack(id, v){ return D.update(D.child(root, 'presence/' + id), { ack: v }); },
    onConn(cb){ connCbs.push(cb); }
  };
}

/* ---------- タイムライン（GOからの逆算） ---------- */
function parseT(v){
  if (v == null || v === '') return null;
  if (typeof v === 'number') return v;
  const m = String(v).trim().replace(/[：]/g, ':').match(/^(\d+)(?::(\d{1,2}))?$/);
  if (!m) return null;
  return m[2] != null ? (+m[1]) * 60 + (+m[2]) : +m[1];
}
const fmtT = sec => { sec = Math.max(0, Math.round(sec)); return `${Math.floor(sec/60)}:${pad(sec%60)}`; };
const hms = t => { const d = new Date(t); return `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`; };
const hasTL = c => !!(c && (parseT(c.dur) || (c.events && c.events.length)));

/* 開始時刻(start)から各合図の時刻を計算。終了基準の合図は「長さ − 何秒前」 */
function timeline(c, start){
  const dur = parseT(c.dur);
  const end = dur != null ? start + dur * 1000 : null;
  const evs = (c.events || []).map((e, k) => {
    const t = parseT(e.t) || 0;
    const rel = e.ref === 'end' ? (dur != null ? dur - t : null) : t;
    return rel == null ? null : { key: 'e' + k, label: e.label || '合図', dept: e.dept || '', rel, at: start + rel * 1000 };
  }).filter(Boolean);
  if (end != null && !evs.some(e => e.at === end)) evs.push({ key: 'end', label: 'このQの終了', dept: '', rel: dur, at: end, isEnd: true });
  return { start, end, dur, evs: evs.sort((a, b) => a.at - b.at) };
}
function previewTL(c){
  if (!hasTL(c)) return '';
  const tl = timeline(c, 0);
  return '⏱ GOから：' + tl.evs.map(e => `${fmtT(e.rel)} ${e.label}`).join(' ／ ');
}
const evMine = e => !e.dept || me.dept === '全体' || me.director || e.dept === me.dept;

let tlFired = new Set();
function drawTL(now){
  const st = room.state, i = Number(st.index ?? -1), c = room.cues[i];
  const box = $('tl');
  if (!c || !hasTL(c) || !st.goAt) { box.innerHTML = ''; return; }
  const tl = timeline(c, st.goAt);
  const nextEv = tl.evs.find(e => e.at > now - 500);
  let html = '';
  if (nextEv) {
    const left = (nextEv.at - now) / 1000;
    html += `<div class="tl-big ${left <= 10 ? 'soon' : ''} ${evMine(nextEv) && !nextEv.isEnd && me.dept !== '全体' && !me.director ? 'mine' : ''}">
      <div class="lb">つぎの合図まで</div>
      <div class="what">${esc(nextEv.label)}</div>
      <div class="cd">${fmtT(Math.ceil(Math.max(0, left)))}</div>
      <div class="abs">${hms(nextEv.at)} ちょうど${nextEv.dept ? '・' + esc(nextEv.dept) : ''}</div></div>`;
  } else {
    html += `<div class="tl-big"><div class="lb">このQの合図はすべて終わりました</div></div>`;
  }
  if (tl.dur) {
    const p = Math.min(1, Math.max(0, (now - tl.start) / (tl.dur * 1000)));
    html += `<div class="tl-bar"><i style="width:${(p*100).toFixed(1)}%"></i></div>
      <div class="tl-remain"><span>経過 ${fmtT((now - tl.start)/1000)}</span><span>残り ${fmtT((tl.end - now)/1000)}／${fmtT(tl.dur)}</span></div>`;
  }
  html += '<div style="margin-top:8px">' + tl.evs.map(e => {
    const cls = [e.at <= now ? 'done' : '', e === nextEv ? 'nx' : '', evMine(e) && e.dept && me.dept !== '全体' && !me.director ? 'mine' : ''].join(' ');
    return `<div class="tl-row ${cls}"><span class="t">${hms(e.at)}</span><span class="r">+${fmtT(e.rel)}</span><span class="l">${esc(e.label)}</span>${e.dept ? `<span class="tag ${e.dept===me.dept?'mine':''}">${esc(e.dept)}</span>` : ''}</div>`;
  }).join('') + '</div>';
  box.innerHTML = html;

  // 合図：3・2・1で短い音、0で画面フラッシュ
  for (const e of tl.evs) {
    if (!evMine(e)) continue;
    const id = st.goAt + ':' + i + ':' + e.key;
    const left = (e.at - now) / 1000;
    for (const n of [3, 2, 1]) {
      const kid = id + ':' + n;
      if (left <= n && left > n - 1 && !tlFired.has(kid)) { tlFired.add(kid); beep(520, .08); }
    }
    if (left <= 0 && left > -2 && !tlFired.has(id)) {
      tlFired.add(id);
      if (!e.isEnd) flashText(e.label, true);
      navigator.vibrate && navigator.vibrate([250, 80, 250]);
      beep(1046, .3);
    }
    if (left <= -2) tlFired.add(id);
  }
}
function flashText(text, ev){
  const f = $('flash');
  f.textContent = text;
  f.style.fontSize = text.length > 6 ? 'clamp(36px, 11vw, 72px)' : '96px';
  f.classList.toggle('ev', !!ev);
  f.classList.remove('show'); void f.offsetWidth; f.classList.add('show');
}

/* ---------- 時計と経過時間 ---------- */
const pad = n => String(n).padStart(2, '0');

  if (!store) return;
  const now = new Date(Date.now() + store.offset());
  $('clock').textContent = `${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;

    $('nowElapsed').textContent = `GOから ${Math.floor(s/60)}:${pad(s%60)}`;
  } else $('nowElapsed').textContent = '';
  drawTL(now.getTime());
}

/* ---------- 合図（画面・振動・音） ---------- */
function cueFired(){
  flashText('GO', false);
  navigator.vibrate && navigator.vibrate([180, 60, 180]);
  beep(880, .18);
}
function standbyFired(){
  navigator.vibrate && navigator.vibrate(120);
  beep(440, .12);
}
function unlockAudio(){
  try { audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)(); audioCtx.resume(); } catch(e){}
}
function beep(freq, dur){
  if (!soundOn || !audioCtx) return;
  try {
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.frequency.value = freq; o.connect(g); g.connect(audioCtx.destination);
    g.gain.setValueAtTime(.25, audioCtx.currentTime); g.gain.exponentialRampToValueAtTime(.001, audioCtx.currentTime + dur);
    o.start(); o.stop(audioCtx.currentTime + dur);
  } catch(e){}
}
$('bSound').onclick = () => { unlockAudio(); soundOn = !soundOn; $('bSound').textContent = soundOn ? '🔔 音 ON' : '🔔 音 OFF'; if (soundOn) beep(660, .1); };

/* 画面を消さない */
async function keepAwake(){
  try { if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen'); } catch(e){}
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && me) keepAwake(); });

/* ---------- Q出し役の操作 ---------- */
const serverNow = () => Date.now() + store.offset();
$('bGO').onclick = () => {
  const i = Number(room.state.index ?? -1);
  if (i >= room.cues.length) return;
  store.setState({ index: i + 1, standby: false, goAt: serverNow(), by: me.name });
};
$('bSB').onclick = () => {
  const on = !room.state.standby;
  store.setState({ ...room.state, standby: on, sbId: on ? Math.random().toString(36).slice(2, 9) : '' });
};
$('ackBtn').onclick = () => { if (room.state.standby && room.state.sbId) store.ack(myId, room.state.sbId); };
$('bBack').onclick = () => {
  const i = Number(room.state.index ?? -1);
  if (i < 0) return;
  store.setState({ index: i - 1, standby: false, goAt: room.state.goAt || 0, by: me.name });
};
$('bReset').onclick = () => { if (confirmLite('最初（開演前）に戻しますか？')) store.setState({ index:-1, standby:false, goAt:0 }); };
$('qlist').onclick = e => {
  if (!me.director) return;
  const it = e.target.closest('[data-k]'); if (!it) return;
  const k = Number(it.dataset.k);
  if (confirmLite(`${room.cues[k].no}「${room.cues[k].title}」に移動しますか？（合図は出ません）`))
    store.setState({ index: k, standby: false, goAt: room.state.goAt || 0, by: me.name });
};
/* 確認：ボタンを2回押す方式（ブラウザのダイアログを使わない） */
let pendingConfirm = null;
function confirmLite(msg){
  if (pendingConfirm === msg) { pendingConfirm = null; return true; }
  pendingConfirm = msg; toast(msg + '　もう一度押すと実行'); setTimeout(() => { if (pendingConfirm === msg) pendingConfirm = null; }, 3000);
  return false;
}
function toast(msg){
  let t = $('toast');
  if (!t) { t = document.createElement('div'); t.id = 'toast'; t.style.cssText = 'position:fixed;left:50%;top:calc(14px + var(--safe-t));transform:translateX(-50%);background:#2c2c35;padding:10px 16px;border-radius:12px;font-size:14px;z-index:60;max-width:90vw;text-align:center'; document.body.appendChild(t); }
  t.textContent = msg; t.style.opacity = 1; clearTimeout(t._h); t._h = setTimeout(() => t.style.opacity = 0, 2800);
}

/* ---------- 編集 ---------- */
let draft = [];
$('bEdit').onclick = () => { draft = room.cues.map(c => ({...c, depts:[...c.depts], events:(c.events||[]).map(e => ({...e}))})); $('eTitle').value = room.meta.title || ''; drawEditor(); $('editSheet').classList.remove('hidden'); };
$('eCancel').onclick = () => $('editSheet').classList.add('hidden');
$('eAdd').onclick = () => { readEditor(); draft.push({ no:'Q' + (draft.length + 1), title:'', depts:[], time:'', memo:'', dur:'', events:[] }); drawEditor(); $('eList').lastElementChild?.querySelector('[data-f="title"]').focus(); };
$('eSave').onclick = async () => {
  readEditor();
  await store.setCues(draft.filter(c => c.title || c.no));
  await store.setTitle($('eTitle').value.trim() || 'イベント');
  $('editSheet').classList.add('hidden'); toast('保存しました（全員に反映）');
};
$('ePasteGo').onclick = () => {
  const rows = $('ePaste').value.split(/\r?\n/).map(r => r.split('\t')).filter(r => r.join('').trim());
  if (!rows.length) return;
  draft = rows.map((r, k) => ({ no:(r[0]||'Q'+(k+1)).trim(), title:(r[1]||'').trim(), depts:(r[2]||'').split(/[,、・\/]/).map(s=>s.trim()).filter(Boolean), time:(r[3]||'').trim(), memo:(r[4]||'').trim(), dur:(r[5]||'').trim(), events:[] }));
  drawEditor(); toast(`${draft.length}件読み込みました。保存で反映`);
};
function drawEditor(){
  setTimeout(updateHints, 0);
  $('eList').innerHTML = draft.map((c, k) => `
    <div class="ecard" data-k="${k}">
      <div class="r1"><input data-f="no" value="${esc(c.no)}" placeholder="番号"><input data-f="title" value="${esc(c.title)}" placeholder="内容"><input data-f="time" value="${esc(c.time)}" placeholder="時刻" inputmode="numeric"></div>
      <div class="depts">${DEPTS.map(d => `<button class="chip ${c.depts.includes(d)?'on':''}" data-dep="${esc(d)}">${esc(d)}</button>`).join('')}</div>
      <div class="r3"><input data-f="memo" value="${esc(c.memo)}" placeholder="メモ"><div class="ops"><button data-op="up">↑</button><button data-op="down">↓</button><button data-op="del" class="del">✕</button></div></div>
      <div class="r4"><input data-f="dur" value="${esc(c.dur || '')}" placeholder="長さ 9:29" inputmode="numeric"><span class="hint">GOからこのQが終わるまでの長さ（なくても可）</span></div>
      ${(c.events || []).map((e, j) => evRowHTML(e, j)).join('')}
      <button class="addev" data-op="addev">＋ 時間指定の合図を追加</button>
    </div>`).join('');
}
function evRowHTML(e, j){
  const t = parseT(e.t);
  return `<div class="evrow" data-ej="${j}">
    <select data-ef="ref"><option value="end" ${e.ref==='end'?'selected':''}>終了の</option><option value="start" ${e.ref!=='end'?'selected':''}>開始から</option></select>
    <input data-ef="t" value="${t != null ? fmtT(t) : ''}" placeholder="1:29" inputmode="numeric">
    <input data-ef="label" value="${esc(e.label || '')}" placeholder="例：ドローン離陸">
    <button data-op="evdel">✕</button>
    <div class="sub2"><select data-ef="dept"><option value="">担当なし</option>${DEPTS.filter(d=>d!=='全体').map(d => `<option ${e.dept===d?'selected':''}>${esc(d)}</option>`).join('')}</select><span class="hint" data-hint></span></div>
  </div>`;
}
function readEditor(){
  document.querySelectorAll('#eList .ecard').forEach(el => {
    const c = draft[+el.dataset.k];
    el.querySelectorAll('[data-f]').forEach(inp => c[inp.dataset.f] = inp.value.trim());
    c.events = [...el.querySelectorAll('.evrow')].map(r => ({
      ref: r.querySelector('[data-ef="ref"]').value,
      t: parseT(r.querySelector('[data-ef="t"]').value) ?? 0,
      label: r.querySelector('[data-ef="label"]').value.trim(),
      dept: r.querySelector('[data-ef="dept"]').value
    }));
  });
}
/* 「終了の1:29前 → GOから8:00」のような換算を表示 */
function updateHints(){
  document.querySelectorAll('#eList .ecard').forEach(el => {
    const dur = parseT(el.querySelector('[data-f="dur"]').value);
    el.querySelectorAll('.evrow').forEach(r => {
      const ref = r.querySelector('[data-ef="ref"]').value, t = parseT(r.querySelector('[data-ef="t"]').value);
      const h = r.querySelector('[data-hint]');
      if (t == null) { h.textContent = ''; return; }
      if (ref === 'end') h.textContent = dur == null ? '⚠︎ 長さを入れてください' : (t > dur ? '⚠︎ 長さより前になります' : `前 → GOから ${fmtT(dur - t)}`);
      else h.textContent = `後 → GOから ${fmtT(t)}`;
    });
  });
}
$('eList').addEventListener('input', updateHints);
$('eList').addEventListener('change', updateHints);
$('eList').onclick = e => {
  const card = e.target.closest('.ecard'); if (!card) return;
  const k = +card.dataset.k;
  const dep = e.target.closest('[data-dep]');
  if (dep) { readEditor(); const d = dep.dataset.dep, a = draft[k].depts; a.includes(d) ? a.splice(a.indexOf(d),1) : a.push(d); drawEditor(); return; }
  const op = e.target.closest('[data-op]')?.dataset.op; if (!op) return;
  readEditor();
  if (op === 'addev') { draft[k].events.push({ ref: parseT(draft[k].dur) ? 'end' : 'start', t: 0, label: '', dept: '' }); drawEditor(); return; }
  if (op === 'evdel') { const j = +e.target.closest('.evrow').dataset.ej; draft[k].events.splice(j, 1); drawEditor(); return; }
  if (op === 'del') draft.splice(k, 1);
  if (op === 'up' && k > 0) [draft[k-1], draft[k]] = [draft[k], draft[k-1]];
  if (op === 'down' && k < draft.length - 1) [draft[k+1], draft[k]] = [draft[k], draft[k+1]];
  drawEditor();
};

/* ---------- そのほか ---------- */
$('fAll').onclick = () => { filterMine = false; $('fAll').classList.add('on'); $('fMine').classList.remove('on'); render(); };
$('fMine').onclick = () => { filterMine = true; $('fMine').classList.add('on'); $('fAll').classList.remove('on'); render(); };
$('bPeople').onclick = $('bPeople2').onclick = () => $('peopleSheet').classList.remove('hidden');
$('pClose').onclick = () => $('peopleSheet').classList.add('hidden');
$('bLogout').onclick = () => { if (confirmLite('退出しますか？')) { const s = ls.get(SESSION_KEY); ls.set(SESSION_KEY, {...s, exp:0}); location.reload(); } };

/* ---------- 起動：24時間以内なら自動で入る ---------- */
const saved = ls.get(SESSION_KEY);
if (saved && saved.exp > Date.now()) enter(saved, false);
else showJoin(saved);
</script>
