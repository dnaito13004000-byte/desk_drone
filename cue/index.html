<script type="module">
const SESSION_KEY = 'dsq-session', SESSION_HOURS = 24, FB_VER = '10.12.2';
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const toArr = v => Array.isArray(v) ? v.filter(Boolean) : (v ? Object.values(v).filter(Boolean) : []);
const pad = n => String(n).padStart(2, '0');
const isDemo = !window.FIREBASE_CONFIG;
const ls = {
  get(k){ try { return JSON.parse(localStorage.getItem(k)); } catch(e){ return null; } },
  set(k,v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }
};

/* 初期値：ステージ9:29、アニメはステージ終了と同時、離陸からアニメまで1:23 */
const DEFAULT_SHOW = { stage: '9:29', anim: '0:00', lead: '1:23' };

/* ---------- データの置き場所 ---------- */
function demoStore(code){
  const key = 'dsq-demo-' + code, bc = ('BroadcastChannel' in window) ? new BroadcastChannel(key) : null, subs = [];
  const read = () => ls.get(key) || {};
  const emit = () => { const d = read(); subs.forEach(f => f(d)); };
  const write = d => { ls.set(key, d); emit(); bc && bc.postMessage(1); };
  if (bc) bc.onmessage = emit;
  addEventListener('storage', e => { if (e.key === key) emit(); });
  return {
    offset: () => 0,
    async getMeta(){ return read().meta || null; },
    async setMeta(m){ const d = read(); d.meta = m; write(d); },
    subscribe(f){ subs.push(f); f(read()); },
    async setState(s){ const d = read(); d.state = s; write(d); },
    async setShow(s){ const d = read(); d.show = s; write(d); },
    async setTitle(t){ const d = read(); d.meta = {...(d.meta||{}), title:t}; write(d); },
    presence(id, info){
      const beat = () => { const d = read(); d.presence = d.presence || {}; d.presence[id] = {...info, online: navigator.onLine, at: Date.now()}; write(d); };
      beat(); setInterval(beat, 8000);
      addEventListener('pagehide', () => { const d = read(); if (d.presence && d.presence[id]) { d.presence[id].online = false; ls.set(key, d); bc && bc.postMessage(1); } });
    },
    onConn(cb){ const f = () => cb(navigator.onLine); addEventListener('online', f); addEventListener('offline', f); f(); }
  };
}
async function firebaseStore(code){
  const base = `https://www.gstatic.com/firebasejs/${FB_VER}/`;
  const { initializeApp } = await import(base + 'firebase-app.js');
  const { getAuth, signInAnonymously } = await import(base + 'firebase-auth.js');
  const D = await import(base + 'firebase-database.js');
  const app = initializeApp(window.FIREBASE_CONFIG), auth = getAuth(app);
  await signInAnonymously(auth);
  const db = D.getDatabase(app), root = D.ref(db, 'rooms/ds_' + code);
  let off = 0; const connCbs = [];
  D.onValue(D.ref(db, '.info/serverTimeOffset'), s => { off = s.val() || 0; });
  return {
    uid: auth.currentUser.uid,
    offset: () => off,
    async getMeta(){ return (await D.get(D.child(root, 'meta'))).val(); },
    async setMeta(m){ await D.set(D.child(root, 'meta'), m); },
    subscribe(f){ D.onValue(root, s => f(s.val() || {})); },
    setState(s){ return D.set(D.child(root, 'state'), s); },
    setShow(s){ return D.set(D.child(root, 'show'), s); },
    setTitle(t){ return D.set(D.child(root, 'meta/title'), t); },
    presence(id, info){
      const p = D.child(root, 'presence/' + id);
      D.onValue(D.ref(db, '.info/connected'), s => {
        const on = !!s.val(); connCbs.forEach(f => f(on));
        if (on) { D.onDisconnect(p).update({ online:false, at: D.serverTimestamp() }); D.update(p, {...info, online:true, at: D.serverTimestamp()}); }
      });
    },
    onConn(cb){ connCbs.push(cb); }
  };
}

/* ---------- 状態 ---------- */
let store = null, me = null, myId = null, connected = null, offTimer = null;
let room = { meta:{}, show: DEFAULT_SHOW, state:{ startAt:0 }, presence:{} };
let soundOn = false, audioCtx = null, lastStart = null, fired = new Set();

/* ---------- 時間の計算 ---------- */
function parseT(v){
  if (v == null || v === '') return null;
  if (typeof v === 'number') return v;
  const m = String(v).trim().replace(/[：]/g, ':').match(/^(\d+)(?::(\d{1,2}))?$/);
  if (!m) return null;
  return m[2] != null ? (+m[1]) * 60 + (+m[2]) : +m[1];
}
const fmtT = sec => { sec = Math.abs(Math.round(sec)); return `${Math.floor(sec/60)}:${pad(sec%60)}`; };
const hms = t => { const d = new Date(t); return `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`; };
const serverNow = () => Date.now() + (store ? store.offset() : 0);

/* 3つの時刻（ステージ開始からの秒数）。表示順は ステージ終了 → ドローン離陸 → アニメーションスタート */
function plan(sh = room.show){
  const stage = parseT(sh.stage) ?? 569, anim = stage + (parseT(sh.anim) ?? 0), lead = parseT(sh.lead) ?? 83;
  return { stage, items: [
    { key: 'end',  name: 'ステージ終了',         rel: stage },
    { key: 'off',  name: 'ドローン離陸',         rel: anim - lead },
    { key: 'anim', name: 'アニメーションスタート', rel: anim }
  ]};
}

/* ---------- 入室 ---------- */
let joinDir = false;
$('jDirSw').onclick = () => { joinDir = !joinDir; $('jDirSw').classList.toggle('on', joinDir); $('jPinBox').classList.toggle('hidden', !joinDir); };
$('modeNote').textContent = isDemo ? 'デモモード：同じブラウザのタブどうしでだけ同期します。' : '入ったあと24時間は、開くだけで自動で入れます。';
const normCode = s => s.trim().toLowerCase().replace(/[.#$\[\]\/\s]/g, '');

$('jGo').onclick = async () => {
  const code = normCode($('jCode').value), name = $('jName').value.trim(), pin = $('jPin').value.trim();
  $('jErr').textContent = '';
  if (!code) return $('jErr').textContent = '合言葉を入れてください';
  if (!name) return $('jErr').textContent = 'お名前を入れてください';
  if (joinDir && pin.length < 4) return $('jErr').textContent = '暗証番号は4桁以上にしてください';
  unlockAudio();
  const sess = { code, name, director: joinDir, pin: joinDir ? pin : '', id: ls.get(SESSION_KEY)?.id || crypto.randomUUID(), exp: Date.now() + SESSION_HOURS*3600e3 };
  await enter(sess, true);
};

async function enter(sess, fromForm){
  $('jGo').disabled = true; $('jGo').textContent = '接続中…';
  try {
    store = isDemo ? demoStore(sess.code) : await firebaseStore(sess.code);
    if (sess.director) {
      const meta = await store.getMeta();
      if (!meta || !meta.pin) {
        await store.setMeta({ pin: sess.pin, title: 'ドローンショー', createdAt: Date.now() });
        await store.setShow(DEFAULT_SHOW);
        await store.setState({ startAt: 0 });
      } else if (String(meta.pin) !== String(sess.pin)) throw new Error('Q出し役の暗証番号が違います');
    }
    me = sess; ls.set(SESSION_KEY, sess);
    myId = isDemo ? sess.id : store.uid;
    store.onConn(setConn);
    store.presence(myId, { name: sess.name, director: !!sess.director });
    store.subscribe(onRoom);
    showMain();
  } catch (err) {
    console.error(err);
    if (!fromForm) ls.set(SESSION_KEY, {...sess, exp:0});
    showJoin(sess);
    $('jErr').textContent = err.message.includes('暗証番号') ? err.message : '接続できませんでした：' + err.message;
  } finally { $('jGo').disabled = false; $('jGo').textContent = '入る'; }
}
function showJoin(sess){
  $('join').classList.remove('hidden'); $('main').classList.add('hidden'); $('ctrl').classList.add('hidden');
  if (sess) { $('jCode').value = sess.code || ''; $('jName').value = sess.name || ''; }
}
function showMain(){
  $('join').classList.add('hidden'); $('main').classList.remove('hidden');
  document.body.classList.toggle('director', !!me.director);
  $('ctrl').classList.toggle('hidden', !me.director);
  $('meLine').textContent = me.name + (me.director ? '・Q出し役' : '');
  keepAwake();
}

/* ---------- 受信 ---------- */
function onRoom(d){
  room.meta = d.meta || {};
  room.show = { ...DEFAULT_SHOW, ...(d.show && d.show.lead ? d.show : {}) };
  room.state = d.state || { startAt: 0 };
  room.presence = d.presence || {};
  const st = room.state.startAt || 0;
  if (lastStart !== null && st && st !== lastStart && !room.state.adjusted && Math.abs(serverNow() - st) < 3000) {
    flashText('ステージ開始', false); navigator.vibrate && navigator.vibrate([180, 60, 180]); beep(880, .2);
  }
  if (!st) fired.clear();
  lastStart = st;
  $('evName').textContent = room.meta.title || 'ドローンショー';
  renderPeople();
  tick();
}

/* ---------- 描画（0.2秒ごと） ---------- */
function tick(){
  if (!store || !me) return;
  const now = serverNow();
  $('clock').textContent = hms(now);
  const { stage, items } = plan();
  const start = room.state.startAt || 0, running = !!start;
  if (me.director) {
    $('bStart').classList.toggle('hidden', running);
    $('runCtrl').classList.toggle('hidden', !running);
    $('bReset').classList.toggle('hidden', !running);
  }
  const wm = $('waitMsg');
  wm.classList.toggle('hidden', running);
  wm.textContent = me.director ? 'ステージ開始の合図で「▶ ステージ開始」を押してください' : 'Q出し役がステージ開始を押すと、カウントダウンが始まります';

  const upcoming = running ? items.filter(it => start + it.rel * 1000 > now - 400).sort((a, b) => a.rel - b.rel)[0] : null;
  $('cds').innerHTML = items.map(it => {
    const at = start + it.rel * 1000, left = (at - now) / 1000;
    if (!running) return `<div class="cdc wait"><div class="hd"><span class="nm">${it.name}まで</span></div><div class="v num">${fmtT(it.rel)}</div><div class="rt num">ステージ開始から</div></div>`;
    if (left <= -0.4) return `<div class="cdc done"><div class="hd"><span class="nm">${it.name}</span><span class="at num"><b>${hms(at)}</b></span></div><div class="v num">✓ 済み</div></div>`;
    const cls = ['cdc', it === upcoming ? 'nx' : '', left <= 10 ? 'soon' : ''].join(' ');
    return `<div class="${cls}"><div class="hd"><span class="nm">${it.name}まで</span></div><div class="v num">${fmtT(Math.ceil(Math.max(0, left)))}</div><div class="rt num"><b>${hms(at)}</b>ちょうど</div></div>`;
  }).join('');
  if (!running) return;

  const groups = {};
  items.forEach(it => { (groups[it.rel] = groups[it.rel] || []).push(it); });
  for (const rel in groups) {
    const g = groups[rel], id = start + ':' + rel, left = (start + (+rel) * 1000 - now) / 1000;
    for (const n of [3, 2, 1]) { const kid = id + ':' + n; if (left <= n && left > n - 1 && !fired.has(kid)) { fired.add(kid); beep(520, .08); } }
    if (left <= 0 && left > -2 && !fired.has(id)) {
      fired.add(id); flashText(g.map(x => x.name).join('\n'), true);
      navigator.vibrate && navigator.vibrate([250, 80, 250]); beep(1046, .35);
    }
    if (left <= -2) fired.add(id);
  }
}
setInterval(tick, 200);

/* ---------- 合図の演出 ---------- */
function flashText(text, ev){
  const f = $('flash');
  f.textContent = text;
  f.style.fontSize = text.length > 6 ? 'clamp(34px, 11vw, 80px)' : 'clamp(48px, 18vw, 110px)';
  f.classList.toggle('ev', !!ev);
  f.classList.remove('show'); void f.offsetWidth; f.classList.add('show');
}
function unlockAudio(){ try { audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)(); audioCtx.resume(); } catch(e){} }
function beep(freq, dur){
  if (!soundOn || !audioCtx) return;
  try {
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.frequency.value = freq; o.connect(g); g.connect(audioCtx.destination);
    g.gain.setValueAtTime(.3, audioCtx.currentTime); g.gain.exponentialRampToValueAtTime(.001, audioCtx.currentTime + dur);
    o.start(); o.stop(audioCtx.currentTime + dur);
  } catch(e){}
}
$('bSound').onclick = () => { unlockAudio(); soundOn = !soundOn; $('bSound').textContent = soundOn ? '🔔 音 ON' : '🔔 音 OFF'; if (soundOn) beep(660, .1); };
async function keepAwake(){ try { if ('wakeLock' in navigator) await navigator.wakeLock.request('screen'); } catch(e){} }
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && me) keepAwake(); });

/* ---------- Q出し役の操作 ---------- */
$('bStart').onclick = () => { unlockAudio(); fired.clear(); store.setState({ startAt: serverNow(), by: me.name }); };
$('bResync').onclick = () => { if (confirmLite('いまの瞬間を「ステージ開始」に合わせ直しますか？')) store.setState({ startAt: serverNow(), by: me.name, adjusted: true }); };
$('bMinus').onclick = () => store.setState({ ...room.state, startAt: room.state.startAt - 1000, adjusted: true }).then(() => toast('全体を1秒早めました'));
$('bPlus').onclick  = () => store.setState({ ...room.state, startAt: room.state.startAt + 1000, adjusted: true }).then(() => toast('全体を1秒遅らせました'));
let resetTimer = null;
$('bReset').onclick = () => {
  const b = $('bReset');
  if (!b.classList.contains('arm')) {
    b.classList.add('arm'); b.textContent = 'もう一度押すと最初に戻ります';
    clearTimeout(resetTimer); resetTimer = setTimeout(() => { b.classList.remove('arm'); b.textContent = '⟲ 最初に戻す'; }, 3000);
    return;
  }
  clearTimeout(resetTimer); b.classList.remove('arm'); b.textContent = '⟲ 最初に戻す';
  store.setState({ startAt: 0 }); toast('最初（ステージ開始前）に戻しました');
};

let pending = null;
function confirmLite(msg){
  if (pending === msg) { pending = null; return true; }
  pending = msg; toast(msg + '　もう一度押すと実行'); setTimeout(() => { if (pending === msg) pending = null; }, 3000);
  return false;
}
function toast(msg){ const t = $('toast'); t.textContent = msg; t.style.opacity = 1; clearTimeout(t._h); t._h = setTimeout(() => t.style.opacity = 0, 2600); }

/* ---------- 設定 ---------- */
$('bEdit').onclick = () => {
  $('eTitle').value = room.meta.title || '';
  const sh = { ...DEFAULT_SHOW, ...room.show };
  $('eStage').value = fmtT(parseT(sh.stage) ?? 569);
  $('eAnim').value = fmtT(parseT(sh.anim) ?? 0);
  $('eLead').value = fmtT(parseT(sh.lead) ?? 83);
  calc(); $('editSheet').classList.remove('hidden');
};
$('eCancel').onclick = () => $('editSheet').classList.add('hidden');
function calc(){
  const st = parseT($('eStage').value), an = parseT($('eAnim').value), ld = parseT($('eLead').value);
  if (st == null || an == null || ld == null) { $('eCalc').textContent = '「9:29」の形で入れてください'; return; }
  const p = plan({ stage: st, anim: an, lead: ld });
  const warn = p.items[1].rel < 0 ? '<br><span style="color:var(--red)">⚠︎ 離陸がステージ開始より前になります</span>' : '';
  $('eCalc').innerHTML = 'ステージ開始から<br>' + p.items.slice().sort((a, b) => a.rel - b.rel)
    .map(it => `<b>${fmtT(Math.max(0, it.rel))}</b>　${it.name}`).join('<br>') + warn;
}
['eStage', 'eAnim', 'eLead'].forEach(id => $(id).addEventListener('input', calc));
$('eSave').onclick = async () => {
  const st = parseT($('eStage').value), an = parseT($('eAnim').value), ld = parseT($('eLead').value);
  if (!st || an == null || ld == null) return toast('時間を「9:29」の形で入れてください');
  await store.setShow({ stage: fmtT(st), anim: fmtT(an), lead: fmtT(ld) });
  await store.setTitle($('eTitle').value.trim() || 'ドローンショー');
  $('editSheet').classList.add('hidden'); toast('保存しました（全員に反映）');
};

/* ---------- 参加者・接続 ---------- */
const STALE_MS = 25000;
const isOnline = p => p && p.online !== false && !(isDemo && Date.now() - (p.at || 0) > STALE_MS);
function renderPeople(){
  const ps = Object.entries(room.presence).map(([id, p]) => ({ id, ...p, on: isOnline(p) }));
  const on = ps.filter(p => p.on), off = ps.filter(p => !p.on);
  const label = `${on.length}/${ps.length}`;
  $('pCount').textContent = label; $('pCount2').textContent = label;
  $('bPeople2').style.color = off.length ? 'var(--amber)' : '';
  const hm = t => { if (!t) return ''; const d = new Date(t); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };
  const row = p => `<div class="pp ${p.on ? '' : 'off'}"><span><span class="dot"></span>${esc(p.name)}${p.director ? '（Q出し役）' : ''}${p.id === myId ? '（自分）' : ''}</span><span style="color:var(--sub)">${p.on ? 'オンライン' : '最終 ' + hm(p.at)}</span></div>`;
  $('pList').innerHTML = `<div class="sec">オンライン ${on.length}人</div>` + (on.map(row).join('') || '<p class="hint">いません</p>') +
    (off.length ? `<div class="sec">オフライン ${off.length}人</div>` + off.map(row).join('') : '');
}
setInterval(() => { if (isDemo && store) renderPeople(); }, 5000);
function setConn(on){
  clearTimeout(offTimer);
  if (on) { connected = true; drawConn(); }
  else offTimer = setTimeout(() => { connected = false; drawConn(); }, connected === null ? 4000 : 1500);
}
function drawConn(){
  $('conn').className = 'conn ' + (connected ? 'on' : connected === false ? 'off' : '');
  $('conn').querySelector('span').textContent = connected ? 'オンライン' : connected === false ? 'オフライン' : '接続中…';
  $('offBanner').classList.toggle('hidden', connected !== false);
}
$('bPeople').onclick = $('bPeople2').onclick = () => $('peopleSheet').classList.remove('hidden');
$('pClose').onclick = () => $('peopleSheet').classList.add('hidden');
$('bLogout').onclick = () => { if (confirmLite('退出しますか？')) { ls.set(SESSION_KEY, {...ls.get(SESSION_KEY), exp:0}); location.reload(); } };

/* ---------- 自動アップデート：新しい版が公開されたら読み込み直す ---------- */
const APP_VER = '7';
async function checkUpdate(){
  try {
    const r = await fetch(location.pathname + '?t=' + Date.now(), { cache: 'no-store' });
    const m = (await r.text()).match(/const APP_VER = '([^']+)'/);
    if (m && m[1] !== APP_VER) location.replace(location.pathname + '?v=' + m[1]);
  } catch(e){}
}
checkUpdate(); setInterval(() => { if (!(room.state && room.state.startAt)) checkUpdate(); }, 60000);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && !(room.state && room.state.startAt)) checkUpdate(); });

/* ---------- 起動 ---------- */
const saved = ls.get(SESSION_KEY);
if (saved && saved.exp > Date.now()) enter(saved, false); else showJoin(saved);
</script>
</body>
</html>
